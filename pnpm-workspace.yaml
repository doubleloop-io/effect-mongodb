packages:
  - packages/*

blockExoticSubdeps: true
minimumReleaseAge: 1440 # 1 day

trustPolicy: no-downgrade
trustPolicyExclude:
  # false positives: semver 5.x/6.x backports published after 7.x versions with provenance
  - semver@5.7.2 || 6.3.1
  # false positive: same maintainer, provenance dropped after 6.19.2 (2024), resumed with trusted publishing
  - undici-types@6.19.8

verifyDepsBeforeRun: false

overrides:
  dependency-tree: "^10.0.9"
  detective-amd: "^5.0.2"
  detective-cjs: "^5.0.1"
  detective-es6: "^4.0.1"
  detective-less: "^1.0.2"
  detective-postcss: "^6.1.3"
  detective-sass: "^5.0.3"
  detective-scss: "^4.0.3"
  detective-stylus: "^4.0.0"
  detective-typescript: "^11.1.0"
  "@types/node": "^22.5.4"

patchedDependencies:
  "@changesets/get-github-info@1.0.1": patches/@changesets__get-github-info@1.0.1.patch

allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
  unrs-resolver: false
